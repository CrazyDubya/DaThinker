name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and validation tools
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -e . pytest pip-audit

      - name: Audit runtime dependencies
        run: pip-audit

      - name: Compile package
        run: python -m compileall -q src

      - name: Run offline security tests
        run: pytest -q tests/test_security_unit.py
